name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Pristine maintenance tools
        uses: actions/checkout@v4
        with:
          repository: nshkrdotcom/pristine
          ref: c43942926d6b8dfb4bd8771b0a1cc19e3093b561
          path: .tooling/pristine
          persist-credentials: false
      - name: Select maintenance tool sources
        run: |
          cat > "$RUNNER_TEMP/pristine_tools.exs" <<'ELIXIR'
          defmodule MixWorkspaceOpsBootstrap do
            @tools_root Path.join(System.fetch_env!("GITHUB_WORKSPACE"), ".tooling/pristine/apps")

            def dep(committed, project_root) do
              app = elem(committed, 0)

              if app in [:pristine_codegen, :pristine_provider_testkit] do
                opts = if tuple_size(committed) == 3, do: elem(committed, 2), else: []
                path = Path.relative_to(Path.join(@tools_root, Atom.to_string(app)), project_root, force: true)
                {app, Keyword.merge(opts, path: path, override: true)}
              else
                committed
              end
            end
          end
          ELIXIR
          echo "MIX_WORKSPACE_OPS_BOOTSTRAP=$RUNNER_TEMP/pristine_tools.exs" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3.1'
          elixir-version: '1.19.5'
      - run: mix deps.get
      - run: mix typesafe.prereq
      - run: mix typesafe.generate --project-root .
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix docs --warnings-as-errors
      - run: mix typesafe.verify --project-root .
      - run: mix hex.build --unpack
