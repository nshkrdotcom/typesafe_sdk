name: Set up TypeSafeSDK maintenance environment
description: Install BEAM and the pinned source-checkout tooling; runtime remains a Hex dependency
inputs:
  elixir:
    required: true
    description: Elixir version
  otp:
    required: true
    description: OTP version
  pristine_ref:
    required: false
    default: ''
    description: Optional Pristine runtime source commit; empty uses Hex
  execution_plane_ref:
    required: false
    default: ''
    description: Optional Execution Plane HTTP source commit; empty uses Hex
runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ inputs.elixir }}
        otp-version: ${{ inputs.otp }}
    - name: Check out pinned Pristine maintenance tools
      uses: actions/checkout@v4
      with:
        repository: nshkrdotcom/pristine
        ref: fb117e55f2c11ba7466481478ad08f79492dc58f
        path: .tooling/pristine
        persist-credentials: false
    - name: Check out prerelease Pristine runtime
      if: inputs.pristine_ref != ''
      uses: actions/checkout@v4
      with:
        repository: nshkrdotcom/pristine
        ref: ${{ inputs.pristine_ref }}
        path: .tooling/pristine-runtime
        persist-credentials: false
    - name: Check out prerelease Execution Plane HTTP
      if: inputs.execution_plane_ref != ''
      uses: actions/checkout@v4
      with:
        repository: nshkrdotcom/execution_plane
        ref: ${{ inputs.execution_plane_ref }}
        path: .tooling/execution-plane
        persist-credentials: false
    - name: Select maintenance tool sources
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/pristine_tools.exs" <<'ELIXIR'
        defmodule MixWorkspaceOpsBootstrap do
          @tools_root Path.join(System.fetch_env!("GITHUB_WORKSPACE"), ".tooling/pristine/apps")
          def dep(committed, project_root) do
            app = elem(committed, 0)
            root = Path.dirname(@tools_root)
            source =
              cond do
                app in [:pristine_codegen, :pristine_provider_testkit] ->
                  Path.join(@tools_root, Atom.to_string(app))
                app == :pristine ->
                  Path.join(root, "../pristine-runtime/apps/pristine_runtime")
                app == :execution_plane_http ->
                  Path.join(root, "../execution-plane/protocols/execution_plane_http")
                true -> nil
              end

            packaging? = Enum.any?(System.argv(), &(&1 in ["hex.build", "hex.publish"]))
            if source && File.dir?(source) && not packaging? do
              opts = if tuple_size(committed) == 3, do: elem(committed, 2), else: []
              path = Path.relative_to(source, project_root, force: true)
              {app, Keyword.merge(opts, path: path, override: true)}
            else
              committed
            end
          end
        end
        ELIXIR
        echo "MIX_WORKSPACE_OPS_BOOTSTRAP=$RUNNER_TEMP/pristine_tools.exs" >> "$GITHUB_ENV"
    - shell: bash
      run: mix deps.get
